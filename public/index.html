<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Streaming Service</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#07090f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="/icon-192.png" />
  <link rel="stylesheet" href="/style.css?v=2.4" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
</head>
<body>

  <!-- ── Login Screen ──────────────────────────────────── -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <i class="fa-solid fa-tower-broadcast"></i>
      </div>
      <h1>Streaming Service</h1>
      <p class="login-sub">Secure live feed access</p>
      <form id="login-form" autocomplete="on">
        <div class="field">
          <i class="fa-solid fa-user field-icon"></i>
          <input type="text" id="f-user" name="username" placeholder="Username" autocomplete="username" required />
        </div>
        <div class="field">
          <i class="fa-solid fa-lock field-icon"></i>
          <input type="password" id="f-pass" name="password" placeholder="Password" autocomplete="current-password" required />
        </div>
        <p id="login-err" class="err-msg"></p>
        <button type="submit" class="btn-primary full-width" id="login-btn">
          <span>Connect</span>
          <i class="fa-solid fa-arrow-right-to-bracket"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- ── App ───────────────────────────────────────────── -->
  <div id="app" class="app hidden">

    <!-- Header -->
    <header class="header">
      <div class="brand">
        <i class="fa-solid fa-tower-broadcast brand-icon"></i>
        <span class="brand-name">Streaming Service</span>
        <span class="live-pill"><span class="dot"></span>LIVE</span>
      </div>
      <nav class="nav">
        <div class="layout-tabs">
          <button class="tab-btn" data-grid="1"  title="1 View">1</button>
          <button class="tab-btn active" data-grid="4"  title="4 View (2×2)">4</button>
          <button class="tab-btn" data-grid="9"  title="9 View (3×3)">9</button>
          <button class="tab-btn" data-grid="0"  title="All Feeds">All</button>
        </div>
        <div class="pager-controls" id="pager-wrap">
          <button id="btn-prev-page" class="pager-btn" title="Previous Page"><i class="fa-solid fa-chevron-left"></i></button>
          <span id="page-indicator" class="page-indicator">1 / 6</span>
          <button id="btn-next-page" class="pager-btn" title="Next Page"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <button id="btn-play-all" class="icon-btn"         title="Stream all visible feeds"><i class="fa-solid fa-play"></i><span class="btn-label">Play All</span></button>
        <button id="btn-add"      class="icon-btn green"   title="Add feed"><i class="fa-solid fa-plus"></i><span class="btn-label">Add Feed</span></button>
        <button id="btn-wake"    class="icon-btn"         title="Keep screen on"><i class="fa-solid fa-sun"></i></button>
        <button id="btn-install" class="icon-btn green hidden" title="Install Android App"><i class="fa-brands fa-android"></i><span class="btn-label">Install</span></button>
        <button id="btn-logout"  class="icon-btn red"     title="Logout"><i class="fa-solid fa-right-from-bracket"></i></button>
      </nav>
    </header>

    <!-- Feed Grid -->
    <main class="grid-wrap">
      <div id="grid" class="grid g2"></div>
    </main>
  </div>

  <!-- ── Add / Edit Feed Modal ─────────────────────────── -->
  <div id="modal" class="modal-bg hidden">
    <div class="modal-box">
      <div class="modal-hd">
        <h3 id="modal-title">Add New Feed</h3>
        <button class="close-btn" id="modal-close">&times;</button>
      </div>
      <form id="cam-form">
        <input type="hidden" id="edit-id" />
        <div class="field">
          <label>Feed Name</label>
          <input type="text" id="c-name" placeholder="e.g. Main Gate" required />
        </div>
        <div class="field-row">
          <div class="field f2">
            <label>IP Address</label>
            <input type="text" id="c-ip" placeholder="192.168.29.X" required />
          </div>
          <div class="field f1">
            <label>Port</label>
            <input type="number" id="c-port" value="554" required />
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Username</label>
            <input type="text" id="c-user" value="admin" required />
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="c-pass" placeholder="Feed password" required />
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Quality</label>
            <select id="c-sub">
              <option value="0">Main Stream (HD)</option>
              <option value="1">Sub Stream (Fast)</option>
            </select>
          </div>
          <div class="field">
            <label>Channel</label>
            <input type="number" id="c-ch" value="1" required />
          </div>
        </div>
        <p id="cam-err" class="err-msg"></p>
        <button type="submit" class="btn-primary full-width">
          <i class="fa-solid fa-floppy-disk"></i> Save & Connect
        </button>
      </form>
    </div>
  </div>

  <!-- JSMpeg player library (renders MPEG1 video on canvas via WebSocket) -->
  <script src="https://cdn.jsdelivr.net/gh/phoboslab/jsmpeg@master/jsmpeg.min.js"></script>
  <script src="/app.js?v=2.4"></script>
</body>
</html>
